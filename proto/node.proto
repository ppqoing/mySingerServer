syntax = "proto3";

package mysingerserver.v2;

message ContentKey {
  bytes md5 = 1;
  uint64 file_size = 2;
}

message LocationKey {
  string machine_id = 1;
  string normalized_path = 2;
}

message Thresholds {
  uint32 pdq_quality_min = 1;
  float aspect_tolerance = 2;
  uint32 pdq_hamming_max = 3;
  uint32 phash_part_hamming_max = 4;
  uint32 phash_min_passed_parts = 5;
  float sobel_min = 6;
  uint32 video_min_valid_frames = 7;
  float video_stage1_min = 8;
  float video_stage2_min = 9;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  INVALID_REQUEST = 1;
  NODE_BUSY = 2;
  NOT_FOUND = 3;
  CONFLICT = 4;
  SNAPSHOT_REQUIRED = 5;
  INTERNAL = 6;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_QUEUED = 1;
  TASK_RUNNING = 2;
  TASK_COMPLETED = 3;
  TASK_FAILED = 4;
  TASK_CANCELLED = 5;
}

enum GroupKind {
  GROUP_KIND_UNSPECIFIED = 0;
  GROUP_EXACT = 1;
  GROUP_SIMILAR_IMAGE = 2;
  GROUP_SIMILAR_VIDEO = 3;
}

enum ReviewDecision {
  REVIEW_UNDECIDED = 0;
  REVIEW_KEEP = 1;
  REVIEW_DELETE = 2;
}

enum DeleteMode {
  DELETE_MODE_UNSPECIFIED = 0;
  DELETE_RECYCLE_BIN = 1;
  DELETE_PERMANENT = 2;
}

enum MediaKind {
  MEDIA_KIND_UNSPECIFIED = 0;
  MEDIA_IMAGE = 1;
  MEDIA_VIDEO = 2;
  MEDIA_OTHER = 3;
}

enum NodeEnumerator {
  NODE_ENUMERATOR_UNSPECIFIED = 0;
  NODE_WINDOWS_WALKER = 1;
  NODE_EVERYTHING = 2;
}

enum NodeWorkerMode {
  NODE_WORKER_MODE_UNSPECIFIED = 0;
  NODE_WORKER_AUTOMATIC = 1;
  NODE_WORKER_MANUAL = 2;
}

message Hello {
  uint32 protocol_version = 1;
  string product_id = 2;
  string peer_name = 3;
}

message NodeStatus {
  string machine_id = 1;
  string listen_address = 2;
  uint32 worker_count = 3;
  uint32 busy_workers = 4;
  uint64 queued_items = 5;
  uint64 running_items = 6;
  uint64 outbox_high_seq = 7;
  bool engine_restarting = 8;
}

message Ping {
  uint64 nonce = 1;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

message CreateScan {
  repeated string roots = 1;
  bool force_recalculate = 2;
  string enumerator = 3;
}

message TaskAccepted {
  string task_id = 1;
}

message CancelTask {
  string task_id = 1;
}

message QueryTask {
  string task_id = 1;
  TaskSummary task = 2;
}

message ListTasks {
  string cursor = 1;
  uint32 limit = 2;
  repeated TaskSummary tasks = 3;
  string next_cursor = 4;
}

message TaskSummary {
  string task_id = 1;
  string task_kind = 2;
  TaskState state = 3;
  uint64 total_items = 4;
  uint64 completed_items = 5;
  uint64 failed_items = 6;
  uint64 skipped_items = 7;
  uint64 outbox_high_seq = 8;
}

message TaskEvent {
  string task_id = 1;
  uint64 event_seq = 2;
  TaskState state = 3;
  uint64 completed_items = 4;
  uint64 total_items = 5;
  uint64 failed_items = 6;
  string stage = 7;
  string error_text = 8;
}

message BrowsePaths {
  string parent_path = 1;
  string cursor = 2;
  uint32 limit = 3;
  repeated PathEntry entries = 4;
  string next_cursor = 5;
}

message PathEntry {
  string display_path = 1;
  bool is_directory = 2;
}

message CreateLocalAnalysis {
  repeated string scan_task_ids = 1;
  GroupKind group_kind = 2;
  Thresholds thresholds = 3;
}

message QueryAnalysisRun {
  string analysis_run_id = 1;
  string state = 2;
  uint64 input_count = 3;
  uint64 candidate_count = 4;
  string error_text = 5;
}

message ListGroups {
  string analysis_run_id = 1;
  GroupKind group_kind = 2;
  string cursor = 3;
  uint32 limit = 4;
  repeated DuplicateGroup groups = 5;
  string next_cursor = 6;
}

message DuplicateGroup {
  string group_id = 1;
  GroupKind kind = 2;
  ContentKey representative = 3;
  uint32 member_count = 4;
  uint64 reclaimable_bytes = 5;
}

message ListGroupMembers {
  string group_id = 1;
  string cursor = 2;
  uint32 limit = 3;
  repeated GroupMember members = 4;
  string next_cursor = 5;
  string analysis_run_id = 6;
}

message GroupMember {
  LocationKey location = 1;
  ContentKey content = 2;
  bool representative = 3;
  float stage1_score = 4;
  uint32 phash_passed_parts = 5;
  float stage2_score = 6;
  ReviewDecision review = 7;
  bool active = 8;
  uint32 width = 9;
  uint32 height = 10;
  uint32 quality = 11;
}

message SaveReviewMark {
  string group_id = 1;
  LocationKey location = 2;
  ReviewDecision decision = 3;
  string analysis_run_id = 4;
}

message PrepareAnalysisInput {
  string analysis_run_id = 1;
  string cursor = 2;
  uint32 limit = 3;
  repeated AnalysisInput inputs = 4;
  string next_cursor = 5;
  repeated string scan_task_ids = 6;
}

message AnalysisInput {
  ContentKey content = 1;
  repeated LocationKey locations = 2;
  MediaKind media_kind = 3;
  bool stage1_complete = 4;
  bool stage2_complete = 5;
}

message DispatchStage2 {
  string analysis_run_id = 1;
  repeated Stage2WorkItem items = 2;
}

message Stage2WorkItem {
  ContentKey content = 1;
  LocationKey source = 2;
  repeated uint32 frame_slots = 3;
}

message PullChanges {
  uint64 after_seq = 1;
  uint32 limit = 2;
}

message SyncChangeBatch {
  repeated SyncChange changes = 1;
  uint64 high_seq = 2;
  uint64 pruned_through_seq = 3;
}

message SyncChange {
  uint64 seq = 1;
  string entity_kind = 2;
  bytes payload = 3;
}

message SyncAck {
  uint64 committed_seq = 1;
}

message BeginSnapshot {
  string snapshot_token = 1;
  uint64 snapshot_high_seq = 2;
}

message ReadSnapshotPage {
  string snapshot_token = 1;
  string table_name = 2;
  string cursor = 3;
  uint32 limit = 4;
  repeated bytes rows = 5;
  string next_cursor = 6;
  bool done = 7;
}

message ReadFile {
  LocationKey location = 1;
  string file_kind = 2;
  uint64 offset = 3;
  uint32 max_bytes = 4;
}

message FileChunk {
  uint64 offset = 1;
  bytes data = 2;
  bool eof = 3;
}

message CreateDeleteBatch {
  string delete_batch_id = 1;
  DeleteMode mode = 2;
  repeated DeleteItem items = 3;
  string analysis_run_id = 4;
  repeated string group_ids = 5;
}

message DeleteItem {
  string delete_item_id = 1;
  string group_id = 2;
  LocationKey location = 3;
  ContentKey expected_content = 4;
  string outcome = 5;
  string message = 6;
}

message GetNodeConfig {}

message NodeConfigValue {
  string listen_ip = 1;
  uint32 port = 2;
  NodeEnumerator enumerator = 3;
  string data_path = 4;
  string config_path = 5;
  string log_path = 6;
  string cache_path = 7;
  uint32 hdd_threads_per_disk = 8;
  uint32 ssd_threads_per_disk = 9;
  uint32 unknown_threads_per_disk = 10;
  uint32 total_threads = 11;
  uint64 block_size_bytes = 12;
  uint64 block_timeout_seconds = 13;
  uint32 block_retries = 14;
  uint32 legacy_worker_count = 15;
  NodeWorkerMode worker_mode = 16;
  uint32 reserved_cores = 17;
  uint32 manual_worker_count = 18;
  NodePostgresConfigValue postgres = 19;
}

message NodePostgresConfigValue {
  bool enabled = 1;
  string host = 2;
  uint32 port = 3;
  string database = 4;
  string username = 5;
  string password = 6;
  uint64 connect_timeout_seconds = 7;
}

message NodeConfigSnapshot {
  string machine_id = 1;
  string version_sha256 = 2;
  NodeConfigValue config = 3;
  uint32 logical_cpu_count = 4;
  uint32 effective_worker_count = 5;
}

message SaveNodeConfig {
  string expected_version_sha256 = 1;
  NodeConfigValue config = 2;
}

message NodeConfigSaved {
  string machine_id = 1;
  string saved_version_sha256 = 2;
}

enum RuntimeStageState {
  RUNTIME_STAGE_STATE_UNSPECIFIED = 0;
  RUNTIME_STAGE_WAITING = 1;
  RUNTIME_STAGE_RUNNING = 2;
  RUNTIME_STAGE_COMPLETED = 3;
  RUNTIME_STAGE_FAILED = 4;
  RUNTIME_STAGE_SKIPPED = 5;
}

message RuntimeTaskSummary {
  string runtime_task_id = 1;
  string machine_id = 2;
  string task_kind = 3;
  string title = 4;
  string state = 5;
  string stage_summary = 6;
  uint64 overall_completed = 7;
  uint64 overall_total = 8;
  bool overall_total_known = 9;
  uint64 overall_failed = 10;
  uint64 overall_skipped = 11;
  optional uint64 outbox_high_seq = 12;
}

message RuntimeStageDetails {
  string stage_id = 1;
  string display_name = 2;
  RuntimeStageState state = 3;
  string unit = 4;
  uint64 completed = 5;
  uint64 total = 6;
  bool total_known = 7;
  uint64 failed = 8;
  uint64 skipped = 9;
  double speed_per_second = 10;
  uint64 elapsed_ms = 11;
  optional uint64 eta_ms = 12;
}

message RuntimeWorkerDetails {
  uint32 slot = 1;
  optional uint32 process_id = 2;
  string stage_id = 3;
  string display_path = 4;
  string physical_disk_id = 5;
  uint64 completed_files = 6;
  double speed_per_second = 7;
  string current_step = 8;
  string cache_detail = 9;
  optional RuntimeWorkerPhase phase = 10;
  optional uint32 cpu_weight = 11;
  optional uint32 decoder_threads = 12;
}

// Worker 在一次文件请求中的真实执行阶段；Hash 由 Node 负责，不属于 Worker 阶段。
enum RuntimeWorkerPhase {
  RUNTIME_WORKER_PHASE_UNSPECIFIED = 0;
  RUNTIME_WORKER_IDLE = 1;
  RUNTIME_WORKER_DECODE = 2;
  RUNTIME_WORKER_FEATURE = 3;
  RUNTIME_WORKER_RESULT_WAIT = 4;
}

// 固定延迟桶；缺少 upper_bound_ms 表示正无穷桶。
message RuntimeLatencyBucket {
  optional uint64 upper_bound_ms = 1;
  uint64 count = 2;
}

// 进程内固定桶延迟分布；空样本时整个消息缺失。
message RuntimeLatencyHistogram {
  repeated RuntimeLatencyBucket buckets = 1;
  uint64 count = 2;
  optional uint64 p50_ms = 3;
  optional uint64 p95_ms = 4;
  optional uint64 p99_ms = 5;
  optional uint64 max_ms = 6;
}

// 一个有界阶段队列的实时占用和真实等待/处理耗时。
message RuntimeQueueMetrics {
  optional uint64 current = 1;
  optional uint64 peak = 2;
  optional uint64 capacity = 3;
  RuntimeLatencyHistogram wait_latency = 4;
  RuntimeLatencyHistogram service_latency = 5;
}

// 一类共享资源的实时占用和真实许可等待/持有耗时。
message RuntimeResourceMetrics {
  optional uint64 current = 1;
  optional uint64 peak = 2;
  optional uint64 capacity = 3;
  RuntimeLatencyHistogram wait_latency = 4;
  RuntimeLatencyHistogram service_latency = 5;
}

// 基础计算实际采用的硬上限；字段缺失表示该任务没有当前进程遥测。
message RuntimeExecutionConfig {
  optional uint32 hash_tasks = 1;
  optional uint32 path_cache_queue_capacity = 2;
  optional uint32 content_cache_queue_capacity = 3;
  optional uint32 decode_queue_capacity = 4;
  optional uint32 persist_queue_capacity = 5;
  optional uint32 worker_slots = 6;
  optional uint32 cpu_budget = 7;
  optional uint32 global_disk_permits = 8;
  optional uint32 hdd_per_disk_permits = 9;
  optional uint32 ssd_per_disk_permits = 10;
  optional uint32 unknown_per_disk_permits = 11;
}

// 已由 Applied 持久化 ACK 确认的媒体类型与大小桶吞吐。
message RuntimeMediaThroughput {
  MediaKind media_kind = 1;
  string size_bucket = 2;
  uint64 files = 3;
  uint64 bytes = 4;
}

// 基础计算一个细分 ownership 的当前值、历史峰值和硬容量。
message RuntimeOwnershipMetrics {
  optional uint64 current = 1;
  optional uint64 peak = 2;
  optional uint64 capacity = 3;
}

// 一个物理盘真实读取许可的当前状态与累计生命周期计数。
message RuntimeDiskReadMetrics {
  string physical_disk_id = 1;
  optional uint64 capacity = 2;
  optional uint64 hash_waiting = 3;
  optional uint64 media_waiting = 4;
  optional uint64 hash_active = 5;
  optional uint64 media_active = 6;
  optional uint64 hash_granted_total = 7;
  optional uint64 media_granted_total = 8;
  optional uint64 hash_released_total = 9;
  optional uint64 media_released_total = 10;
}

// 基础计算进程内流水线指标；不写入 SQLite 或 PostgreSQL。
message RuntimePipelineMetrics {
  RuntimeQueueMetrics hash_queue = 1;
  RuntimeQueueMetrics path_cache_queue = 2;
  RuntimeQueueMetrics content_cache_queue = 3;
  RuntimeQueueMetrics decode_queue = 4;
  RuntimeQueueMetrics persist_queue = 5;
  RuntimeResourceMetrics hash_io = 6;
  RuntimeResourceMetrics media_io = 7;
  RuntimeResourceMetrics cpu_weight = 8;
  RuntimeResourceMetrics worker_slots = 9;
  optional uint64 hash_bytes = 10;
  repeated RuntimeMediaThroughput media_throughput = 11;
  RuntimeOwnershipMetrics hash_waiting_permit = 12;
  RuntimeOwnershipMetrics hash_reading = 13;
  RuntimeOwnershipMetrics hash_completed_unjoined = 14;
  RuntimeOwnershipMetrics media_permit_waiting = 15;
  RuntimeOwnershipMetrics media_acquire_ready = 16;
  RuntimeOwnershipMetrics media_permit_ready = 17;
  RuntimeOwnershipMetrics worker_dispatching = 18;
  RuntimeOwnershipMetrics worker_start_pending = 19;
  RuntimeOwnershipMetrics worker_decode = 20;
  RuntimeOwnershipMetrics worker_feature = 21;
  RuntimeOwnershipMetrics worker_result_wait = 22;
  RuntimeOwnershipMetrics worker_phase_unknown = 23;
  RuntimeOwnershipMetrics content_output_credit_owned = 24;
  // 统一复用 ownership 的 wire shape，但它是控制状态，不参与 RAII 守恒。
  RuntimeOwnershipMetrics hash_refill_token_available = 25;
  RuntimeOwnershipMetrics decode_credit_owned = 26;
  RuntimeLatencyHistogram item_completion_latency = 27;
  repeated RuntimeDiskReadMetrics disk_reads = 28;
}

message RuntimeFailureDetails {
  string stage_id = 1;
  string display_path = 2;
  string message = 3;
}

message RuntimeTaskDetails {
  RuntimeTaskSummary summary = 1;
  repeated RuntimeStageDetails stages = 2;
  repeated RuntimeWorkerDetails workers = 3;
  repeated RuntimeFailureDetails failures = 4;
  RuntimeExecutionConfig execution_config = 5;
  RuntimePipelineMetrics pipeline_metrics = 6;
}

message ListRuntimeTasks {
  string cursor = 1;
  uint32 limit = 2;
  repeated RuntimeTaskSummary tasks = 3;
  string next_cursor = 4;
}

message GetRuntimeTaskDetails {
  string runtime_task_id = 1;
  RuntimeTaskDetails details = 2;
}

message RuntimeTaskChanged {
  string runtime_task_id = 1;
  string state = 2;
  optional uint64 outbox_high_seq = 3;
}

message Envelope {
  uint64 request_id = 1;
  oneof payload {
    Hello hello = 10;
    NodeStatus node_status = 11;
    Ping ping = 12;
    Error error = 13;
    CreateScan create_scan = 14;
    TaskAccepted task_accepted = 15;
    CancelTask cancel_task = 16;
    QueryTask query_task = 17;
    ListTasks list_tasks = 18;
    TaskEvent task_event = 19;
    BrowsePaths browse_paths = 20;
    CreateLocalAnalysis create_local_analysis = 21;
    QueryAnalysisRun query_analysis_run = 22;
    ListGroups list_groups = 23;
    ListGroupMembers list_group_members = 24;
    SaveReviewMark save_review_mark = 25;
    PrepareAnalysisInput prepare_analysis_input = 26;
    DispatchStage2 dispatch_stage2 = 27;
    PullChanges pull_changes = 28;
    SyncChangeBatch sync_change_batch = 29;
    SyncAck sync_ack = 30;
    BeginSnapshot begin_snapshot = 31;
    ReadSnapshotPage read_snapshot_page = 32;
    ReadFile read_file = 33;
    FileChunk file_chunk = 34;
    CreateDeleteBatch create_delete_batch = 35;
    GetNodeConfig get_node_config = 37;
    NodeConfigSnapshot node_config_snapshot = 38;
    SaveNodeConfig save_node_config = 39;
    NodeConfigSaved node_config_saved = 40;
    ListRuntimeTasks list_runtime_tasks = 43;
    GetRuntimeTaskDetails get_runtime_task_details = 44;
    RuntimeTaskChanged runtime_task_changed = 45;
  }
}

message ProbeAndStage1 {
  string task_id = 1;
  string item_id = 2;
  string display_path = 3;
  MediaKind media_kind = 4;
  bool generate_contact_sheet = 5;
}

message ComputeStage2 {
  string task_id = 1;
  string item_id = 2;
  string display_path = 3;
  repeated uint32 frame_slots = 4;
  string contact_sheet_path = 5;
  bool generate_contact_sheet_if_missing = 6;
}

// Node 已完成 MD5 与缓存解析后发出的单次基础媒体计算请求。
message ComputeBaseFeatures {
  string task_id = 1;
  string item_id = 2;
  string machine_id = 3;
  string normalized_path = 4;
  string display_path = 5;
  uint64 file_size = 6;
  string physical_disk_id = 7;
  bytes md5 = 8;
  MediaKind media_kind = 9;
  uint32 missing_parts = 10;
  uint64 block_size_bytes = 11;
  uint64 block_timeout_ms = 12;
  uint32 block_retries = 13;
  // 当前请求允许 FFmpeg 解码器使用的显式线程预算；必须至少为 1。
  uint32 decoder_threads = 14;
}

// Worker 已关闭源文件且后续结果生成不会再访问源媒体的非终态事件。
message BaseSourceReadComplete {
  string task_id = 1;
  string item_id = 2;
  optional uint64 request_elapsed_us = 3;
}

// Worker 完成二次特征源文件读取、但仍保留结果生成槽位的非终态事件。
message Stage2SourceReadComplete {
  string task_id = 1;
  string item_id = 2;
  optional uint64 request_elapsed_us = 3;
}

// Worker 在真实执行边界即时发出的非终态阶段事件。
message WorkerPhaseChanged {
  string task_id = 1;
  string item_id = 2;
  RuntimeWorkerPhase phase = 3;
  optional uint64 request_elapsed_us = 4;
}

message BaseComputeResult {
  string task_id = 1;
  string item_id = 2;
  bytes md5 = 3;
  bytes payload = 4;
}

message BuildContactSheet {
  string task_id = 1;
  string item_id = 2;
  string display_path = 3;
  repeated uint32 frame_slots = 4;
}

message WorkerReady {
  uint32 process_id = 1;
}

message Stage1Result {
  string task_id = 1;
  string item_id = 2;
  bytes payload = 3;
}

message Stage2Result {
  string task_id = 1;
  string item_id = 2;
  bytes payload = 3;
}

message ContactSheetResult {
  string task_id = 1;
  string item_id = 2;
  bytes jpeg = 3;
  uint32 width = 4;
  uint32 height = 5;
}

message WorkerFailure {
  string task_id = 1;
  string item_id = 2;
  string stage = 3;
  string message = 4;
}

message WorkerEnvelope {
  reserved 13, 14, 25;
  reserved "begin_base_compute", "continue_base_compute", "base_hash_ready";

  oneof payload {
    ProbeAndStage1 probe_and_stage1 = 10;
    ComputeStage2 compute_stage2 = 11;
    BuildContactSheet build_contact_sheet = 12;
    ComputeBaseFeatures compute_base_features = 15;
    WorkerReady worker_ready = 20;
    Stage1Result stage1_result = 21;
    Stage2Result stage2_result = 22;
    ContactSheetResult contact_sheet_result = 23;
    WorkerFailure worker_failure = 24;
    BaseComputeResult base_compute_result = 26;
    BaseSourceReadComplete base_source_read_complete = 27;
    WorkerPhaseChanged worker_phase_changed = 28;
    Stage2SourceReadComplete stage2_source_read_complete = 29;
  }
}
