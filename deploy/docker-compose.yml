services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dedup
      POSTGRES_PASSWORD: dedup
      POSTGRES_DB: dedup
    ports:
      - "5432:5432"
    volumes:
      - dedup-postgres:/var/lib/postgresql/data
      - ./central.sql:/docker-entrypoint-initdb.d/001-central.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dedup -d dedup"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dedup-postgres:
