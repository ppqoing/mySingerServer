name: mysingerserver-rust-v2-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dedup_v2
      POSTGRES_USER: dedup
      POSTGRES_PASSWORD: dedup
    ports:
      - "127.0.0.1:15439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dedup -d dedup_v2"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./central-v2.sql:/schema/central-v2.sql:ro
